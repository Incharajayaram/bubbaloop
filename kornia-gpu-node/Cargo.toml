[package]
name = "kornia-gpu-node"
version = "0.1.0"
edition = "2021"
description = "Bubbaloop node: webcam -> GPU imgproc (CubeCL wgpu) -> CompressedImage publisher"

[[bin]]
name = "kornia_gpu_node"
path = "src/main.rs"

[dependencies]
# Local Bubbaloop SDK crates
bubbaloop-node-sdk = { path = "../crates/bubbaloop-node-sdk" }
bubbaloop-schemas = { path = "../crates/bubbaloop-schemas" }

# Kornia + V4L capture
kornia = { path = "/home/incharanew/kornia-rs/crates/kornia", features = ["v4l"] }
kornia-vlm = { path = "/home/incharanew/kornia-rs/crates/kornia-vlm", features = ["cuda"] }
candle-core = { version = "=0.9.1", features = ["cuda"] }
candle-nn = { version = "=0.9.1", features = ["cuda"] }
candle-transformers = { version = "=0.9.1", features = ["cuda"] }
candle-examples = { version = "=0.9.1" }
candle-kernels = { version = "=0.9.1" }

# GPU compute
cubecl = { version = "0.9.0", features = ["wgpu"] }
cubecl-wgpu = { version = "0.9.0" }
pollster = "0.3"

# Image encoding
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Protobuf
anyhow = "1"
prost = "0.14"

# Async + config
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[build-dependencies]
prost-build = "0.14"

[features]
default = []
vlm = ["kornia-vlm/flash-attn"]

[workspace]
